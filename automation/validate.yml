name: Validate course materials

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required course files
        run: |
          test -f README.md
          test -d labs
          test -f challenge.md
          test -f starter/profile.md
          echo "Course structure looks good."
